spring:
  application:
    name: EasyApply
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # Supabase / small Postgres poolers often allow ~15 session clients total.
    # Keep Hikari tiny so Render + local don't exhaust the pool.
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Needed for Supabase transaction pooler (port 6543).
        connection:
          provider_disables_autocommit: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.send
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  # Render sets PORT; local default 9001
  port: ${PORT:9001}
  servlet:
    session:
      cookie:
        # Cross-origin local frontend → Render needs None + Secure (set on Render).
        # Local backend: leave defaults (lax / false).
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true

# Former RabbitMQ auto-email path — now in-process after scrape.
# Set enabled=true and fill token/path to restore auto-send after /scrap/getEmails.
easyapply:
  frontend-url: ${EASYAPPLY_FRONTEND_URL:http://localhost:4200}
  # LinkedIn company search provider: apify | harvest
  # Override with env: EASYAPPLY_LINKEDIN_PROVIDER=harvest
  linkedin:
    provider: ${EASYAPPLY_LINKEDIN_PROVIDER:harvest}
  apify:
    api-key: ${EASYAPPLY_APIFY_API_KEY:}
  harvest:
    api-key: ${EASYAPPLY_HARVEST_API_KEY:}
  serpapi:
    api-key: ${EASYAPPLY_SERPAPI_API_KEY:}
  auto-email:
    enabled: false
    oauth-token: ""
    resume-path: ${EASYAPPLY_RESUME_PATH:}
    sender-name: ${EASYAPPLY_SENDER_NAME:khmoussi aouina}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-starter: ${STRIPE_PRICE_STARTER:}
    price-pro: ${STRIPE_PRICE_PRO:}

